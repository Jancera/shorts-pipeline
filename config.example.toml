# Copy to config.toml and edit. config.toml is git-ignored.
projects_dir = "projects"
assets_dir   = "/home/jancera/media/shorts-assets"
aspect       = "9:16"

[transcribe]
model = "whisper-1"

[ideate]
model = "gpt-4.1"

[voice]
# Local VoiceStudio server (https://github.com/debpalash/VoiceStudio) - must be
# running before `voice`. base_url defaults to VoiceStudio's default port.
# base_url = "http://localhost:3900"
model = "omnivoice"   # engine id from GET /engines (e.g. omnivoice, voxcpm2, cosyvoice)
voice  = "39f10351"   # voice profile id from GET /v1/audio/voices (your cloned voice)
# language = "pt"      # ISO 639-1 code; omit to let the engine auto-detect
# speed = 1.0          # 0.25 - 4.0
# instruct = "Narre num tom calmo e confiante, com ritmo pausado."
#   free-text style instruction sent to the engine (support varies by engine)

[render]
min_beat_duration = 3.0

[render.subtitle]
# Burned-in captions from the transcript (ai-vedit plan --subtitles + styling).
enabled = true
# Every styling key below is optional; omit one to keep ai-vedit's own default.
# font = "Montserrat"
# font_size = 18
# primary_color = "#FFFFFF"      # hex #RRGGBB
# bold = true
# italic = false
# uppercase = false
# position = "bottom"            # bottom | middle | top
# margin_vertical = 40
# max_chars_per_line = 32
# max_lines = 2
# max_duration = 4.0            # seconds per caption cue

[youtube]
# client_secret = "client_secret.json"   # path to the downloaded OAuth "Desktop app" client
# token_path    = ".youtube_token.json"  # OAuth token cache (default; git-ignored)
category_id     = 20                      # default YouTube category (20 Gaming, 24 Entertainment, 23 Comedy, 27 Education, 28 Science & Technology, 26 Howto & Style, 10 Music, 22 People & Blogs)

[tiktok]
# App credentials come from .env (TIKTOK_CLIENT_KEY / TIKTOK_CLIENT_SECRET), not here.
# token_path    = ".tiktok_token.json"   # OAuth token cache (default; git-ignored)
# TikTok posts immediately - no scheduling. Unaudited apps can only use SELF_ONLY.
privacy_level   = "SELF_ONLY"            # SELF_ONLY | PUBLIC_TO_EVERYONE | MUTUAL_FOLLOW_FRIENDS | FOLLOWER_OF_CREATOR
# disable_duet    = false
# disable_stitch  = false
# disable_comment = false
# is_aigc         = false                # label the post as AI-generated content
